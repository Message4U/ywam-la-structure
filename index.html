<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon.png?v=2">
  <link rel="apple-touch-icon" href="./icon.png?v=2">
  <meta name="apple-mobile-web-app-title" content="YWAM LA">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>YWAM LA Structure</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    body {
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 22px 16px 50px;
    }

    /* YWAM LA LOGO */

    .main-logo {
      width: 100%;
      max-width: 280px;
      margin: 5px auto 22px;
      text-align: center;
    }

    .main-logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* INTRO */

    .intro {
      text-align: center;
      margin-bottom: 18px;
    }

    .intro p {
      display: inline-block;
      margin: 0;
      padding: 11px 18px;
      border: 1px solid #c9e6e3;
      border-radius: 999px;
      background: #eef8f7;
      color: #185e5b;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.2px;
    }

    /* STRUCTURE DIAGRAM */

    .diagram-container {
      position: relative;
      width: 100%;
      margin: 0 auto;
    }

    .diagram-container img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    /* CLICKABLE AREAS */

    .hotspot {
      position: absolute;
      display: block;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    /* UofN */

    .hotspot-uofn {
      top: 0%;
      left: 38%;
      width: 47%;
      height: 68%;
      transform: rotate(-20deg);
      border-radius: 45%;
    }

    /* GO */

    .hotspot-go {
      top: 19%;
      left: 3%;
      width: 43%;
      height: 70%;
      transform: rotate(18deg);
      border-radius: 45%;
    }

    /* CAMPUS */

    .hotspot-campus {
      top: 63%;
      left: 26%;
      width: 70%;
      height: 29%;
      border-radius: 45%;
    }

    /* VISION */

    .vision {
      max-width: 460px;
      margin: 24px auto 32px;
      padding: 18px 20px;
      border-radius: 12px;
      background: #f3f8f7;
      text-align: center;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.6;
      color: #326460;
    }

    /* BASE DIRECTORS */
    .base-directors { margin: 24px auto 0; text-align: center; }
    .base-directors h2 { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #666; }
    .base-directors ul { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; gap: 8px 24px; flex-wrap: wrap; }
    .base-directors li { font-size: 16px; font-weight: 600; line-height: 1.5; color: #333; }

    .leadership-team ul {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      max-width: 460px;
      margin: 0 auto;
    }
    .leadership-team li { min-width: 0; overflow-wrap: anywhere; }

    /* DETAILS */

    #details {
      display: none;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border: none;
      background: none;
      padding: 0;
      margin-bottom: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .area-header {
      padding: 25px 22px;
      border-radius: 22px;
      margin-bottom: 25px;
    }

    .area-header h2 {
      margin: 0;
      font-size: 38px;
      letter-spacing: -1px;
    }

    .area-header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    /* AREA COLORS */

    .uofn-color {
      background: #d94b2b;
      color: white;
    }

    .go-color {
      background: #f5a623;
      color: white;
    }

    .campus-color {
      background: #239d9b;
      color: white;
    }

    /* RESPONSIBILITIES */

    .section-label {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: bold;
      color: #999;
      letter-spacing: 1.5px;
    }

    .department {
      padding: 18px 3px;
      border-bottom: 1px solid #e7e7e7;
    }

    .department-name {
      font-size: 18px;
      font-weight: 700;
    }

    .department-person {
      margin-top: 6px;
      font-size: 15px;
      color: #666;
    }

    .department-email {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin-top: 5px;
      padding: 4px 0;
      font-size: 14px;
      line-height: 1.5;
      color: #326460;
      text-decoration: underline;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    /* MOBILE */

    @media (max-width: 420px) {

      .app {
        padding: 18px 12px 40px;
      }

      .main-logo {
        max-width: 240px;
        margin-bottom: 20px;
      }

      .vision {
        font-size: 16px;
        padding-left: 15px;
        padding-right: 15px;
      }

      .area-header h2 {
        font-size: 34px;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- HOME -->

  <main id="home">

    <!-- YWAM LA LOGO -->

    <div class="main-logo">
      <img
        src="ywma_la_new_logo_horizontal.png"
        alt="YWAM LA"
      >
    </div>

    <!-- INSTRUCTION -->

    <!-- STRUCTURE -->

    <div class="diagram-container">

      <img
        src="structure-ywamla.jpg"
        alt="YWAM LA Structure"
      >

      <button
        class="hotspot hotspot-uofn"
        aria-label="Open UofN"
        onclick="openArea('UofN')">
      </button>

      <button
        class="hotspot hotspot-go"
        aria-label="Open GO"
        onclick="openArea('GO')">
      </button>

      <button
        class="hotspot hotspot-campus"
        aria-label="Open Campus"
        onclick="openArea('Campus')">
      </button>

    </div>

    <!-- VISION -->

    <div class="vision">
      A dynamic movement of Jesus messengers for LA and the Nations
    </div>

    <section class="base-directors" aria-labelledby="directors-title">
      <h2 id="directors-title">Base Directors</h2>
      <ul>
        <li>Fabio Pelacio</li>
        <li>Felipe Duarte</li>
      </ul>
    </section>

    <section class="base-directors leadership-team" aria-labelledby="leadership-title">
      <h2 id="leadership-title">Leadership Team</h2>
      <ul>
        <li>Fabio Pelacio</li>
        <li>Felipe Duarte</li>
        <li>Aline Duarte</li>
        <li>Laura Butcher</li>
        <li>Higor Domingues</li>
        <li>Kristen Hurley</li>
        <li>Simeon Bertelsen</li>
      </ul>
    </section>

  </main>


  <!-- DETAILS -->

  <section id="details">

    <button
      class="back-button"
      onclick="goHome()">
      ← Structure
    </button>

    <div
      id="areaHeader"
      class="area-header">

      <h2 id="areaTitle"></h2>
      <p id="areaSubtitle"></p>

    </div>

    <p class="section-label">
      RESPONSIBILITIES
    </p>

    <div id="departmentList"></div>

  </section>

</div>


<script>

const areas = {

  UofN: {

    subtitle: "Training & Schools",

    color: "uofn-color",

    departments: [
      ["DTS", "Laura Butcher"],
      ["DBS", "Ane / Luciano"],
      ["Mission Adventures", "Higor / Carol"],
      ["Bible / Online BCC", "Patrick"]
    ]

  },

  GO: {

    subtitle: "Projects & Outreach",

    color: "go-color",

    departments: [
      ["GO28+","Fabio & Ana Pelacio","go28@ywamla.org"],
      ["Hollywood","Kristen Hurley","goteam@ywamla.org"],
      ["Venice Beach","Go Team","goteam@ywamla.org"],
      ["Neighborhood","Go Team","goteam@ywamla.org"],
      ["Sports","Fabio Pelacio / Alicia & Marcelo","sports@ywamla.org"],
      ["OBT - Jesus Film","Luciano Duarte"],
      ["Justice for the Unborn","Helena Buswell","helenab@ywamla.org"],
      ["Global Partners","Designated Staff"]
    ]

  },

  Campus: {

    subtitle: "Community & Operations",

    color: "campus-color",

    departments: [
      ["Member Care", "Ane / Adriana Costa"],
      ["Hospitality", "Ana"],
      ["Guest House", "Juliana"],
      ["Housing", "Juliana"],
      ["Facilities", "Paul"],
      ["Maintenance", "Paul Bertelsen"],
      ["Grounds", "Simeon"],
      ["Ship-Shape", "Simeon"],
      ["Transportation", "Simeon"],
      ["Kitchen", "Marcelo / Joana / Ana"],
      ["Reception", "Ann Marie"],
      ["Coffee Shop", "Mary"]
    ]

  }

};


function openArea(areaName) {

  const area = areas[areaName];

  document.getElementById("home").style.display = "none";
  document.getElementById("details").style.display = "block";

  document.getElementById("areaTitle").textContent =
    areaName;

  document.getElementById("areaSubtitle").textContent =
    area.subtitle;

  const header =
    document.getElementById("areaHeader");

  header.className =
    "area-header " + area.color;

  const list =
    document.getElementById("departmentList");

  list.innerHTML = "";

  area.departments.forEach(function(item) {

    const department =
      document.createElement("div");

    department.className =
      "department";

    department.innerHTML = `
      <div class="department-name">
        ${item[0]}
      </div>

      <div class="department-person">
        ${item[1]}
      </div>
    `;

    if (item[2]) {
      const email = document.createElement("a");
      email.className = "department-email";
      email.href = "mailto:" + item[2];
      email.textContent = item[2];
      department.appendChild(email);
    }

    list.appendChild(department);

  });

  window.scrollTo(0, 0);
}


function goHome() {

  document.getElementById("details").style.display =
    "none";

  document.getElementById("home").style.display =
    "block";

  window.scrollTo(0, 0);
}

</script>

</body>
</html>
